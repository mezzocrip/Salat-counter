<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Suivi des Prières</title>

  <!-- Configuration PWA pour iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prières">
  
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%230f172a'/><circle cx='256' cy='256' r='200' fill='none' stroke='%23334155' stroke-width='8'/><path d='M210 130 A110 110 0 1 0 340 310 A125 125 0 1 1 210 130 Z' fill='%23fbbf24'/><polygon points='330,170 338,195 364,195 343,211 351,236 330,220 309,236 317,211 296,195 322,195' fill='%23f59e0b'/><path d='M160 380 Q 256 300 352 380 L 160 400 Z' fill='%231e293b'/></svg>">
  <link rel="manifest" href='data:application/json,{"name":"Suivi des Prières","short_name":"Prières","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%22120%22 fill=%22%230f172a%22/><circle cx=%22256%22 cy=%22256%22 r=%22200%22 fill=%22none%22 stroke=%22%23334155%22 stroke-width=%228%22/><path d=%22M210 130 A110 110 0 1 0 340 310 A125 125 0 1 1 210 130 Z%22 fill=%22%23fbbf24%22/><polygon points=%22330,170 338,195 364,195 343,211 351,236 330,220 309,236 317,211 296,195 322,195%22 fill=%22%23f59e0b%22/><path d=%22M160 380 Q 256 300 352 380 L 160 400 Z%22 fill=%22%231e293b%22/></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    }
    @media (min-width: 768px) and (orientation: landscape) {
      .app-layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 1.5rem;
        height: calc(100vh - 3rem);
      }
      .scrollable-content {
        overflow-y: auto;
      }
    }
    /* Animation Secousse d'erreur */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .shake {
      animation: shake 0.35s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6 antialiased flex items-center justify-center">

  <!-- ==================== ÉCRAN 1 : LOGIN / SELECTION PROFIL ==================== -->
  <div id="login-screen" class="w-full max-w-md bg-slate-800/90 backdrop-blur border border-slate-700/60 p-6 md:p-8 rounded-3xl shadow-2xl text-center">
    <div class="text-4xl mb-3">🌙</div>
    <h1 class="text-2xl font-bold tracking-tight text-amber-400 mb-1">Suivi des Prières</h1>
    <p class="text-xs text-slate-400 mb-8">Choisissez votre profil pour continuer</p>

    <div class="space-y-4 mb-8">
      <button onclick="loginUser('Joyce')" class="w-full py-4 px-6 rounded-2xl font-bold text-lg transition-all border border-slate-600 bg-slate-700/70 text-slate-100 hover:bg-amber-500 hover:border-amber-400 hover:text-slate-900 flex items-center justify-between shadow-lg group">
        <span class="flex items-center gap-3">
          <span class="text-2xl">👤</span> Joyce
        </span>
        <span id="badge-pin-Joyce" class="text-xs font-normal text-slate-400 group-hover:text-slate-900"></span>
      </button>

      <button onclick="loginUser('Terrance')" class="w-full py-4 px-6 rounded-2xl font-bold text-lg transition-all border border-slate-600 bg-slate-700/70 text-slate-100 hover:bg-amber-500 hover:border-amber-400 hover:text-slate-900 flex items-center justify-between shadow-lg group">
        <span class="flex items-center gap-3">
          <span class="text-2xl">👤</span> Terrance
        </span>
        <span id="badge-pin-Terrance" class="text-xs font-normal text-slate-400 group-hover:text-slate-900"></span>
      </button>
    </div>

    <button onclick="openPinModal('parent')" class="text-xs bg-slate-900/60 hover:bg-slate-900 text-slate-400 hover:text-slate-200 px-4 py-2.5 rounded-xl border border-slate-700 transition-all inline-flex items-center gap-2">
      ⚙️ Réglages Parent
    </button>
  </div>

  <!-- ==================== MODALE PAVÉ NUMÉRIQUE COMPACT ==================== -->
  <div id="pin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div id="pin-card" class="bg-[#1c222b] border border-slate-800 p-6 md:p-8 rounded-[32px] w-full max-w-[320px] text-center shadow-2xl">
      
      <h3 id="pin-modal-title" class="text-lg font-bold text-slate-100 mb-1">Code PIN requis</h3>
      <p id="pin-modal-sub" class="text-xs text-slate-400 mb-6">Saisissez votre code à 4 chiffres</p>
      
      <!-- Les 4 Puces PIN -->
      <div class="flex justify-center gap-4 mb-2">
        <div id="dot-0" class="w-3.5 h-3.5 rounded-full border border-slate-500 bg-transparent transition-all"></div>
        <div id="dot-1" class="w-3.5 h-3.5 rounded-full border border-slate-500 bg-transparent transition-all"></div>
        <div id="dot-2" class="w-3.5 h-3.5 rounded-full border border-slate-500 bg-transparent transition-all"></div>
        <div id="dot-3" class="w-3.5 h-3.5 rounded-full border border-slate-500 bg-transparent transition-all"></div>
      </div>

      <p id="pin-error-msg" class="text-xs text-rose-400 font-medium h-6 mb-2"></p>

      <!-- Clavier Numérique -->
      <div class="grid grid-cols-3 gap-3 justify-items-center">
        <button onclick="pressPin('1')" class="w-16 h-16 rounded-full bg-[#2a323d] active:bg-slate-600 flex items-center justify-center text-2xl font-medium text-slate-100 transition-all">1</button>
        <button onclick="pressPin('2')" class="w-16 h-16 rounded-full bg-[#2a323d] active:bg-slate-600 flex items-center justify-center text-2xl font-medium text-slate-100 transition-all">2</button>
        <button onclick="pressPin('3')" class="w-16 h-16 rounded-full bg-[#2a323d] active:bg-slate-600 flex items-center justify-center text-2xl font-medium text-slate-100 transition-all">3</button>
        <button onclick="pressPin('4')" class="w-16 h-16 rounded-full bg-[#2a323d] active:bg-slate-600 flex items-center justify-center text-2xl font-medium text-slate-100 transition-all">4</button>
        <button onclick="pressPin('5')" class="w-16 h-16 rounded-full bg-[#2a323d] active:bg-slate-600 flex items-center justify-center text-2xl font-medium text-slate-100 transition-all">5</button>
        <button onclick="pressPin('6')" class="w-16 h-16 rounded-full bg-[#2a323d] active:bg-slate-600 flex items-center justify-center text-2xl font-medium text-slate-100 transition-all">6</button>
        <button onclick="pressPin('7')" class="w-16 h-16 rounded-full bg-[#2a323d] active:bg-slate-600 flex items-center justify-center text-2xl font-medium text-slate-100 transition-all">7</button>
        <button onclick="pressPin('8')" class="w-16 h-16 rounded-full bg-[#2a323d] active:bg-slate-600 flex items-center justify-center text-2xl font-medium text-slate-100 transition-all">8</button>
        <button onclick="pressPin('9')" class="w-16 h-16 rounded-full bg-[#2a323d] active:bg-slate-600 flex items-center justify-center text-2xl font-medium text-slate-100 transition-all">9</button>
        
        <!-- Ligne du bas : Annuler / 0 / Effacer -->
        <button onclick="closePinModal()" class="w-16 h-16 flex items-center justify-center text-sm font-medium text-rose-500 active:opacity-70">Annuler</button>
        <button onclick="pressPin('0')" class="w-16 h-16 rounded-full bg-[#2a323d] active:bg-slate-600 flex items-center justify-center text-2xl font-medium text-slate-100 transition-all">0</button>
        <button onclick="clearPin()" class="w-16 h-16 flex items-center justify-center text-xl text-slate-400 active:text-slate-100">⌫</button>
      </div>

    </div>
  </div>

  <!-- ==================== ÉCRAN 2 : DASHBOARD APPLICATION ==================== -->
  <div id="app-screen" class="w-full max-w-6xl mx-auto app-layout hidden">
    
    <!-- COLONNE GAUCHE : Profil & Solde -->
    <div class="flex flex-col justify-between bg-slate-800/80 backdrop-blur border border-slate-700/60 p-5 rounded-2xl mb-6 md:mb-0 shadow-xl">
      <div>
        <div class="flex justify-between items-center mb-6">
          <div class="flex items-center gap-2">
            <span class="text-xl">🌙</span>
            <span id="current-user-name" class="font-bold text-lg text-amber-400"></span>
          </div>
          <button onclick="logout()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-600 transition-all flex items-center gap-1">
            🚪 Changer
          </button>
        </div>

        <!-- Solde Totale -->
        <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 mb-4">
          <span class="text-xs text-slate-400 block mb-1">Cagnotte disponible</span>
          <div class="flex items-baseline gap-1">
            <span id="user-balance" class="text-4xl font-extrabold text-emerald-400">0</span>
            <span class="text-2xl font-bold text-emerald-400">€</span>
          </div>
        </div>

        <!-- Boutons d'actions -->
        <div class="space-y-2 mb-4">
          <!-- Bouton Dépense -->
          <button onclick="addExpense()" class="w-full py-3 px-4 bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/40 text-rose-300 rounded-xl font-semibold text-sm transition-all flex items-center justify-center gap-2 shadow-lg shadow-rose-500/10">
            🛒 Enregistrer une dépense
          </button>

          <!-- Bouton Don / Tips (Protégé Parent) -->
          <button onclick="openPinModal('tip')" class="w-full py-3 px-4 bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-300 rounded-xl font-semibold text-sm transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/10">
            🎁 Donner un tips / Argent de poche
          </button>
        </div>

        <!-- Barre de progression -->
        <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
          <div class="flex justify-between text-xs mb-2">
            <span class="text-slate-400">Progression aujourd'hui</span>
            <span id="progress-text" class="text-amber-400 font-semibold">0/5 (0€)</span>
          </div>
          <div class="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
            <div id="progress-bar" class="bg-gradient-to-r from-amber-500 to-emerald-400 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <div class="mt-6 pt-4 border-t border-slate-700/50 text-center">
        <button onclick="openPinModal('parent')" class="text-xs text-slate-500 hover:text-slate-400">
          ⚙️ Accès administration parent
        </button>
      </div>
    </div>

    <!-- COLONNE DROITE : Prières du jour + Historique -->
    <div class="scrollable-content space-y-6">
      
      <!-- Liste des prières -->
      <div class="bg-slate-800/80 backdrop-blur border border-slate-700/60 p-5 rounded-2xl shadow-xl">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-100">Prières du jour</h2>
          <span id="current-date" class="text-xs text-slate-400 bg-slate-700/50 px-2.5 py-1 rounded-md"></span>
        </div>

        <div id="prayers-list" class="space-y-3">
          <!-- Généré en JS -->
        </div>
      </div>

      <!-- Historique avec filtres Mois / Année -->
      <div class="bg-slate-800/80 backdrop-blur border border-slate-700/60 p-5 rounded-2xl shadow-xl">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
          <h2 class="text-lg font-bold text-slate-100">Historique</h2>
          
          <div class="flex items-center gap-1 bg-slate-900/60 p-1 rounded-xl border border-slate-700/50 text-xs">
            <button id="filter-all" onclick="setHistoryFilter('all')" class="px-2.5 py-1 rounded-lg font-medium text-amber-400 bg-slate-800">Tout</button>
            <button id="filter-month" onclick="setHistoryFilter('month')" class="px-2.5 py-1 rounded-lg font-medium text-slate-400">Ce mois</button>
            <button id="filter-year" onclick="setHistoryFilter('year')" class="px-2.5 py-1 rounded-lg font-medium text-slate-400">Cette année</button>
          </div>
        </div>

        <div id="history-summary" class="grid grid-cols-2 gap-2 mb-3 text-xs bg-slate-900/40 p-2.5 rounded-xl border border-slate-700/30">
          <div class="text-emerald-400 font-medium">Gagné : <span id="summary-gained" class="font-bold">0€</span></div>
          <div class="text-rose-400 font-medium">Dépensé : <span id="summary-spent" class="font-bold">0€</span></div>
        </div>

        <div id="history-list" class="space-y-2 text-sm max-h-56 overflow-y-auto pr-1 text-slate-400">
          <p class="text-xs italic">Chargement de la base de données...</p>
        </div>
      </div>

    </div>
  </div>

  <!-- FIREBASE CONFIGURÉ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCa6-YBdpdFisBDwPVR_sK2_-4gCLUIYh4",
      authDomain: "salat-count.firebaseapp.com",
      databaseURL: "https://salat-count-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "salat-count",
      storageBucket: "salat-count.firebasestorage.app",
      messagingSenderId: "563219751634",
      appId: "1:563219751634:web:ddbdb74b3266a7c6edc30b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const PRAYERS = [
      { id: "fajr", name: "Fajr", icon: "🌅" },
      { id: "dhuhr", name: "Dhuhr", icon: "☀️" },
      { id: "asr", name: "Asr", icon: "🌤️" },
      { id: "maghrib", name: "Maghrib", icon: "🌆" },
      { id: "isha", name: "Isha", icon: "🌙" }
    ];

    const MASTER_PIN = "0941";
    let currentUser = null;
    let currentFilter = "all";
    
    let pinTarget = null;
    let currentEnteredPin = "";

    let userData = {
      Joyce: { balance: 36, pin: "", history: {}, currentDay: {} },
      Terrance: { balance: 0, pin: "", history: {}, currentDay: {} }
    };

    const todayObj = new Date();
    const todayStr = todayObj.toISOString().split('T')[0];
    const currentMonthStr = todayStr.substring(0, 7);
    const currentYearStr = todayStr.substring(0, 4);

    document.getElementById("current-date").textContent = todayObj.toLocaleDateString('fr-FR', {
      weekday: 'long', day: 'numeric', month: 'long'
    });

    const usersRef = ref(db, 'users');
    onValue(usersRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.Joyce) userData.Joyce = { ...userData.Joyce, ...data.Joyce };
        if (data.Terrance) userData.Terrance = { ...userData.Terrance, ...data.Terrance };
      } else {
        set(ref(db, 'users/Joyce'), userData.Joyce);
        set(ref(db, 'users/Terrance'), userData.Terrance);
      }
      updateLoginBadges();
      if (currentUser) renderUI();
    });

    function updateLoginBadges() {
      document.getElementById("badge-pin-Joyce").textContent = (userData.Joyce.pin && userData.Joyce.pin !== "") ? "🔒 Protegé" : "🔓 Libre d'accès";
      document.getElementById("badge-pin-Terrance").textContent = (userData.Terrance.pin && userData.Terrance.pin !== "") ? "🔒 Protegé" : "🔓 Libre d'accès";
    }

    // Gestion de la modale PIN
    window.openPinModal = function(target) {
      pinTarget = target;
      currentEnteredPin = "";
      document.getElementById("pin-error-msg").textContent = "";
      updateDots();

      const subEl = document.getElementById("pin-modal-sub");
      if (target === 'parent' || target === 'tip') {
        subEl.textContent = "Code Administrateur Parent";
      } else {
        subEl.textContent = `Saisissez le code pour ${target}`;
      }

      document.getElementById("pin-modal").classList.remove("hidden");
    };

    window.closePinModal = function() {
      document.getElementById("pin-modal").classList.add("hidden");
      currentEnteredPin = "";
    };

    window.pressPin = function(digit) {
      if (currentEnteredPin.length < 4) {
        currentEnteredPin += digit;
        updateDots();
        if (currentEnteredPin.length === 4) {
          setTimeout(validatePin, 80);
        }
      }
    };

    window.clearPin = function() {
      if (currentEnteredPin.length > 0) {
        currentEnteredPin = currentEnteredPin.slice(0, -1);
        updateDots();
      }
    };

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < currentEnteredPin.length) {
          dot.className = "w-3.5 h-3.5 rounded-full border border-amber-400 bg-amber-400 shadow-sm shadow-amber-400/50 transition-all scale-110";
        } else {
          dot.className = "w-3.5 h-3.5 rounded-full border border-slate-500 bg-transparent transition-all";
        }
      }
    }

    function validatePin() {
      let isValid = false;

      if (pinTarget === 'parent' || pinTarget === 'tip') {
        isValid = (currentEnteredPin === MASTER_PIN);
      } else {
        const userPin = userData[pinTarget]?.pin;
        isValid = (currentEnteredPin === userPin || currentEnteredPin === MASTER_PIN);
      }

      if (isValid) {
        if (pinTarget === 'parent') {
          closePinModal();
          openSettingsMenu();
        } else if (pinTarget === 'tip') {
          closePinModal();
          addTip();
        } else {
          currentUser = pinTarget;
          closePinModal();
          showAppScreen();
        }
      } else {
        const card = document.getElementById("pin-card");
        document.getElementById("pin-error-msg").textContent = "Code PIN incorrect";
        card.classList.add("shake");

        currentEnteredPin = "";
        updateDots();

        setTimeout(() => {
          card.classList.remove("shake");
        }, 400);
      }
    }

    window.loginUser = function(user) {
      const userPin = userData[user]?.pin;
      if (!userPin || userPin.trim() === "") {
        currentUser = user;
        showAppScreen();
      } else {
        openPinModal(user);
      }
    };

    window.logout = function() {
      currentUser = null;
      document.getElementById("app-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
    };

    function showAppScreen() {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("app-screen").classList.remove("hidden");
      renderUI();
    }

    function openSettingsMenu() {
      const choice = prompt(
        "--- RÉGLAGES PARENT ---\n\n" +
        "1. Définir/Modifier le code PIN de Joyce\n" +
        "2. Définir/Modifier le code PIN de Terrance\n" +
        "3. Ajuster la cagnotte de Joyce\n" +
        "4. Ajuster la cagnotte de Terrance\n\n" +
        "Entrez le numéro de votre choix (1, 2, 3 ou 4) :"
      );

      if (choice === "1") {
        const newPin = prompt("Nouveau code PIN (4 chiffres) pour Joyce (Laissez vide pour supprimer) :", userData.Joyce.pin || "");
        if (newPin !== null) {
          set(ref(db, 'users/Joyce/pin'), newPin.trim());
          alert(newPin.trim() === "" ? "Code PIN supprimé." : "Code PIN mis à jour !");
        }
      } else if (choice === "2") {
        const newPin = prompt("Nouveau code PIN (4 chiffres) pour Terrance (Laissez vide pour supprimer) :", userData.Terrance.pin || "");
        if (newPin !== null) {
          set(ref(db, 'users/Terrance/pin'), newPin.trim());
          alert(newPin.trim() === "" ? "Code PIN supprimé." : "Code PIN mis à jour !");
        }
      } else if (choice === "3") {
        const newBal = prompt("Ajuster la cagnotte de Joyce (€) :", userData.Joyce.balance || 0);
        if (newBal !== null && !isNaN(newBal)) set(ref(db, 'users/Joyce/balance'), parseInt(newBal, 10));
      } else if (choice === "4") {
        const newBal = prompt("Ajuster la cagnotte de Terrance (€) :", userData.Terrance.balance || 0);
        if (newBal !== null && !isNaN(newBal)) set(ref(db, 'users/Terrance/balance'), parseInt(newBal, 10));
      }
    }

    window.setHistoryFilter = function(filter) {
      currentFilter = filter;
      renderUI();
    };

    // OPTION A : COCHER / DÉCOCHER LA PRIÈRE + SUPPRESSION DE L'HISTORIQUE EN CAS DE DÉCOCHAGE
    window.togglePrayer = function(prayerId) {
      const userRefPath = `users/${currentUser}`;
      const isChecked = !(userData[currentUser]?.currentDay?.[todayStr]?.[prayerId]);
      const currentBalance = userData[currentUser]?.balance || 0;
      const newBalance = isChecked ? currentBalance + 1 : Math.max(0, currentBalance - 1);

      const timestamp = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      const prayerName = PRAYERS.find(p => p.id === prayerId).name;

      const updates = {};
      updates[`${userRefPath}/currentDay/${todayStr}/${prayerId}`] = isChecked;
      updates[`${userRefPath}/balance`] = newBalance;
      
      if (isChecked) {
        // COCHER : On ajoute la ligne dans l'historique
        const historyKey = Date.now();
        updates[`${userRefPath}/history/${historyKey}`] = {
          text: `${todayStr} à ${timestamp} : ${prayerName} (+1€)`,
          date: todayStr,
          type: 'gain',
          prayerId: prayerId,
          amount: 1
        };
      } else {
        // DÉCOCHER (OPTION A) : On trouve la clé d'historique de cette prière aujourd'hui et on la supprime (null)
        const historyObj = userData[currentUser]?.history || {};
        Object.keys(historyObj).forEach(key => {
          const item = historyObj[key];
          if (typeof item === 'object' && item.date === todayStr && item.prayerId === prayerId) {
            updates[`${userRefPath}/history/${key}`] = null;
          }
        });
      }

      update(ref(db), updates);
    };

    window.addExpense = function() {
      const currentBalance = userData[currentUser]?.balance || 0;
      const amountStr = prompt(`Montant de la dépense pour ${currentUser} (€) :`);
      if (!amountStr || isNaN(amountStr) || parseFloat(amountStr) <= 0) return;

      const amount = parseFloat(amountStr);
      if (amount > currentBalance) {
        alert(`Solde insuffisant ! ${currentUser} n'a que ${currentBalance}€ disponible.`);
        return;
      }

      const reason = prompt("Objet de la dépense (ex: Jouet, Bonbons, Livre...) :") || "Dépense";
      const timestamp = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      const newBalance = currentBalance - amount;

      const userRefPath = `users/${currentUser}`;
      const historyKey = Date.now();

      const updates = {};
      updates[`${userRefPath}/balance`] = newBalance;
      updates[`${userRefPath}/history/${historyKey}`] = {
        text: `🛒 ${todayStr} à ${timestamp} : ${reason} (-${amount}€)`,
        date: todayStr,
        type: 'expense',
        amount: amount
      };

      update(ref(db), updates);
    };

    function addTip() {
      const amountStr = prompt(`Montant du don / argent de poche pour ${currentUser} (€) :`);
      if (!amountStr || isNaN(amountStr) || parseFloat(amountStr) <= 0) return;

      const amount = parseFloat(amountStr);
      const reason = prompt("Raison du don (ex: Argent de poche, Cadeau, Aide...) :") || "Don / Tips";
      const currentBalance = userData[currentUser]?.balance || 0;
      const timestamp = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      const newBalance = currentBalance + amount;

      const userRefPath = `users/${currentUser}`;
      const historyKey = Date.now();

      const updates = {};
      updates[`${userRefPath}/balance`] = newBalance;
      updates[`${userRefPath}/history/${historyKey}`] = {
        text: `🎁 ${todayStr} à ${timestamp} : ${reason} (+${amount}€)`,
        date: todayStr,
        type: 'gain',
        amount: amount
      };

      update(ref(db), updates);
      alert(`+${amount}€ ajoutés avec succès à la cagnotte de ${currentUser} !`);
    }

    function renderUI() {
      if (!currentUser) return;

      document.getElementById("current-user-name").textContent = currentUser;

      const balance = userData[currentUser]?.balance || 0;
      document.getElementById("user-balance").textContent = balance;

      const todayPrayers = userData[currentUser]?.currentDay?.[todayStr] || {};
      const prayersContainer = document.getElementById("prayers-list");
      prayersContainer.innerHTML = "";

      let count = 0;

      PRAYERS.forEach(p => {
        const done = !!todayPrayers[p.id];
        if (done) count++;

        const card = document.createElement("div");
        card.onclick = () => window.togglePrayer(p.id);
        card.className = `flex items-center justify-between p-4 rounded-xl border transition-all cursor-pointer ${
          done 
            ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-200' 
            : 'bg-slate-900/40 border-slate-700/60 text-slate-300 hover:border-slate-500'
        }`;

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-xl">${p.icon}</span>
            <span class="font-semibold text-base">${p.name}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold ${done ? 'text-emerald-400' : 'text-slate-500'}">+1 €</span>
            <div class="w-6 h-6 rounded-lg border flex items-center justify-center ${
              done ? 'bg-emerald-500 border-emerald-400 text-slate-900' : 'border-slate-600 bg-slate-800'
            }">
              ${done ? '✓' : ''}
            </div>
          </div>
        `;
        prayersContainer.appendChild(card);
      });

      const percent = (count / 5) * 100;
      document.getElementById("progress-bar").style.width = `${percent}%`;
      document.getElementById("progress-text").textContent = `${count}/5 (${count}€)`;

      ['all', 'month', 'year'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === currentFilter) {
          btn.className = "px-2.5 py-1 rounded-lg font-medium text-amber-400 bg-slate-800 shadow";
        } else {
          btn.className = "px-2.5 py-1 rounded-lg font-medium text-slate-400 hover:text-slate-200";
        }
      });

      const historyContainer = document.getElementById("history-list");
      const historyObj = userData[currentUser]?.history || {};
      const historyKeys = Object.keys(historyObj).sort().reverse();

      let totalGained = 0;
      let totalSpent = 0;
      let filteredItems = [];

      historyKeys.forEach(k => {
        const item = historyObj[k];
        if (!item) return; // Sécurité si un élément vient d'être supprimé (null)

        const isObj = typeof item === 'object';
        const text = isObj ? item.text : item;
        const itemDate = isObj ? item.date : (text.match(/\d{4}-\d{2}-\d{2}/)?.[0] || '');
        const isExpense = isObj ? item.type === 'expense' : (text.includes('🛒') || text.includes('(-'));

        let keep = true;
        if (currentFilter === 'month' && !itemDate.startsWith(currentMonthStr)) keep = false;
        if (currentFilter === 'year' && !itemDate.startsWith(currentYearStr)) keep = false;

        if (keep) {
          filteredItems.push({ text, isExpense });
          if (isObj) {
            if (item.type === 'expense') totalSpent += item.amount;
            else totalGained += item.amount;
          } else {
            if (isExpense) totalSpent += 1;
            else totalGained += 1;
          }
        }
      });

      document.getElementById("summary-gained").textContent = `${totalGained}€`;
      document.getElementById("summary-spent").textContent = `${totalSpent}€`;

      if (filteredItems.length === 0) {
        historyContainer.innerHTML = `<p class="text-xs italic text-slate-500 py-2">Aucune activité enregistrée pour cette période.</p>`;
      } else {
        historyContainer.innerHTML = filteredItems.map(item => `
          <div class="py-1.5 border-b border-slate-700/40 flex justify-between items-center text-xs ${item.isExpense ? 'text-rose-300' : 'text-emerald-300'}">
            <span>${item.text}</span>
          </div>
        `).join('');
      }
    }
  </script>
</body>
</html>
